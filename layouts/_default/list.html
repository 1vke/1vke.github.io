{{ define "main" }}
<h1 class="section-title">{{ .Title }}</h1>
{{ if .Data.Singular }}
<small><a href="{{ "blog" | relURL }}">Remove filter</a></small>
{{ end }}
{{ .Content }}
<div class="post-list">
  {{ range .Pages }}
  <article class="post-row">
    <a class="post-row-link" href="{{ .RelPermalink }}">
      <h2 class="post-row-title">{{ .Title }}</h2>
      <p class="post-row-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></p>
    </a>
  </article>
  {{ else }}
  <p class="empty-state">Nothing here yet.</p>
  {{ end }}
</div>
{{ end }}
