{{/* Context: a project page */}}
<article class="card">
  <a class="card-link" href="{{ .RelPermalink }}">
    {{ with .Resources.GetMatch "thumbnail.*" }}
    <img class="card-media" src="{{ .RelPermalink }}" alt="" loading="lazy">
    {{ end }}
    <div class="card-body">
      <h3 class="card-title">{{ .Title }}</h3>
      {{ with .Params.context }}<p class="card-context">{{ . }}</p>{{ end }}
      <p class="card-summary">{{ .Summary | plainify }}</p>
    </div>
  </a>
  {{ with .GetTerms "tags" }}
  <div class="card-tags">
    {{ range . }}<a class="tag" href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}
  </div>
  {{ end }}
</article>
