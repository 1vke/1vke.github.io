<div id="star-container" class="DO_NOT_OPEN_VERY_LAGGY" aria-hidden="true">
<style>
/* Generated by generate_stars.py — do not edit by hand */
#star-container .sk{position:absolute;left:0;top:-600px;width:100%;height:calc(100% + 1200px);background-repeat:repeat;will-change:transform;}
#star-container .cw{position:absolute;inset:0;will-change:opacity}
#star-container .tw{position:absolute;inset:0;background-repeat:repeat}
@keyframes sk-drift{to{transform:translateY(-600px)}}
@keyframes sk-tw{to{background-position:0 -7200px}}
@keyframes sk-fx{from{opacity:1}to{opacity:0}}
@keyframes sk-fi{from{opacity:0}to{opacity:1}}
.sk.l0{background-image:url(/img/stars/l0-light.png);background-size:480px 600px}
.sk.l1{background-image:url(/img/stars/l1-light.png);background-size:480px 600px}
.tw.l2{background-image:url(/img/stars/l2-light.png);background-size:480px 7200px}
@media (prefers-color-scheme: dark){
.sk.l0{background-image:url(/img/stars/l0-dark.png);background-size:480px 600px}
.sk.l1{background-image:url(/img/stars/l1-dark.png);background-size:480px 600px}
.tw.l2{background-image:url(/img/stars/l2-dark.png);background-size:480px 7200px}
}
</style>
<div class="sk l0" style="animation:sk-drift 50s steps(1000,end) infinite" data-dur="50"></div>
<div class="sk l1" style="animation:sk-drift 100s steps(1000,end) infinite" data-dur="100"></div>
<div class="sk l2" style="animation:sk-drift 150s steps(1000,end) infinite" data-dur="150"><div class="cw" style="animation:sk-fx 0.75s steps(10,end) infinite" data-dur="0.75"><div class="tw l2" style="animation:sk-tw 9s steps(12,end) infinite" data-dur="9"></div></div><div class="cw" style="animation:sk-fi 0.75s steps(10,end) infinite" data-dur="0.75"><div class="tw l2" style="animation:sk-tw 9s steps(12,end) -0.75s infinite" data-dur="9" data-off="0.75"></div></div></div>
<script>(function(){var n=Date.now()/1e3;document.querySelectorAll('#star-container [data-dur]').forEach(function(e){var D=e.dataset.dur.split(','),O=(e.dataset.off||'0').split(',');e.style.animationDelay=D.map(function(d,i){return -((n+(+O[i]||0))%d)+'s'}).join(',');});})();</script>
</div>
